services:
  mysqldb:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: Qwerty123!
      MYSQL_DATABASE: PetSupplyEcom
    ports:
      - "3306:3306"
      - "33060:33060"
    volumes:
      - mysqldb_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped
    networks:
      - PetSupplynet

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: petsupply-backend:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/PetSupplyEcom?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Qwerty123!
    ports:
      - "8080:8080"
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - PetSupplynet

networks:
  PetSupplynet:
    driver: bridge

volumes:
  mysqldb_data:
    driver: local
